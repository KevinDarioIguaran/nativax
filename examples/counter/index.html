<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NativaX counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NativaX Native Runtime</h1>
  </header>
  <main>
    <div class="card" id="card">
      <h2 id="title">HTML + CSS + JavaScript</h2>
      <p>C11 runtime, Sokol GFX renderer, native DOM and JavaScriptCore.
      No Flutter, no WebView, no embedded browser.</p>
      <div class="btn" id="count">Clicked 0 times</div>
      <div class="btn alt" id="toggle">Toggle theme</div>
    </div>
    <div class="note" id="note">Edit style.css or app.js while `nativax dev` runs.</div>
  </main>
  <footer>native-c-sokol — dev server + hot reload</footer>
  <script src="app.js"></script>
</body>
</html>

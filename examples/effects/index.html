<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NativaX Effects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Renderer effects</h1></header>
  <main>
    <div class="badge">rounded</div>
    <div class="group">
      <div class="chip a">A</div>
      <div class="chip b">B</div>
    </div>
    <div class="clip"><p>This text is clipped by overflow hidden and must not leak outside the box.</p></div>
    <div class="moved">translated</div>
    <div class="rotated">rotated</div>
  </main>
  <script src="app.js"></script>
</body>
</html>

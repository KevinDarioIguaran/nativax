<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento · 10.000 nodos</title>
<style>
  :root { --bg:#f4f1ea; --paper:#fffdf8; --ink:#1f1d1a; --muted:#6b665d; --accent:#8a3b12; --line:#e3ddd0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --paper:#1f1e1b; --ink:#e8e4da; --muted:#9a9488; --accent:#e0915f; --line:#35332e; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.7 Georgia, "Times New Roman", serif; }
  header.bar { position:sticky; top:0; z-index:10; display:flex; gap:12px; align-items:center; justify-content:space-between;
    padding:10px 20px; background:var(--paper); border-bottom:1px solid var(--line); font:14px system-ui, sans-serif; }
  header.bar b { color:var(--accent); }
  header.bar input { width:90px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  header.bar button { padding:5px 10px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  main { max-width:760px; margin:32px auto; padding:56px 64px; background:var(--paper); border:1px solid var(--line);
    box-shadow:0 2px 18px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:2.1rem; line-height:1.2; }
  .meta { margin:0 0 32px; color:var(--muted); font:14px system-ui, sans-serif; }
  #doc h2 { margin:2.2em 0 .6em; padding-bottom:.25em; font-size:1.35rem; color:var(--accent); border-bottom:1px solid var(--line); scroll-margin-top:70px; }
  #doc p { margin:0 0 .9em; text-align:justify; hyphens:auto; content-visibility:auto; contain-intrinsic-size:auto 90px; }
  #doc p::first-letter { font-weight:600; }
  @media (max-width:700px) { main { margin:0; padding:28px 20px; border:0; } }
  @media print { header.bar { display:none; } main { box-shadow:none; border:0; margin:0; max-width:none; } }
</style>
</head>
<body>
<header class="bar">
  <span>Nodos en <code>#doc</code>: <b id="count">…</b></span>
  <span>
    <input id="sec" type="number" min="1" max="100" placeholder="Sección">
    <button id="go">Ir</button>
  </span>
</header>

<main>
  <h1>Informe General de Sistemas Distribuidos</h1>
  <p class="meta">Documento generado dinámicamente · 100 secciones · 10.000 nodos</p>
  <article id="doc"></article>
</main>

<script>
(function () {
  const TOTAL = 10000, SECTIONS = 100;           // 100 h2 + 9.900 p = 10.000
  const PER = TOTAL / SECTIONS;                   // 100 nodos por sección (1 h2 + 99 p)

  const sujetos = ['El sistema','La arquitectura','Cada módulo','El servidor','La capa de datos','El cliente','El protocolo','La red','El planificador','El equipo'];
  const verbos  = ['procesa','almacena','distribuye','valida','sincroniza','replica','monitorea','optimiza','registra','transforma'];
  const objetos = ['las solicitudes entrantes','los registros históricos','los eventos del usuario','los paquetes de información','las tareas pendientes','los índices de búsqueda','las sesiones activas','los metadatos asociados','los flujos de trabajo','las copias de seguridad'];
  const modos   = ['de forma asíncrona','con tolerancia a fallos','bajo carga sostenida','en tiempo real','mediante colas de mensajes','sin bloquear el hilo principal','con reintentos exponenciales','de manera incremental','usando caché distribuida','con trazabilidad completa'];
  const cierres = ['garantizando consistencia eventual.','reduciendo la latencia promedio.','minimizando el uso de memoria.','facilitando el mantenimiento futuro.','cumpliendo los acuerdos de nivel de servicio.','permitiendo escalar horizontalmente.','evitando cuellos de botella.','mejorando la experiencia final.'];
  const temas   = ['Introducción','Antecedentes','Marco teórico','Arquitectura','Modelo de datos','Concurrencia','Seguridad','Rendimiento','Despliegue','Observabilidad'];

  // PRNG determinista: el documento es siempre el mismo
  let seed = 20251022;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const frase = () => `${pick(sujetos)} ${pick(verbos)} ${pick(objetos)} ${pick(modos)}, ${pick(cierres)}`;
  const parrafo = () => Array.from({ length: 2 + Math.floor(rnd() * 3) }, frase).join(' ');

  const frag = document.createDocumentFragment();
  for (let s = 1; s <= SECTIONS; s++) {
    const h = document.createElement('h2');
    h.id = 's' + s;
    h.textContent = `${s}. ${temas[(s - 1) % temas.length]} — parte ${Math.ceil(s / temas.length)}`;
    frag.appendChild(h);
    for (let i = 1; i < PER; i++) {
      const p = document.createElement('p');
      p.textContent = parrafo();
      frag.appendChild(p);
    }
  }

  const doc = document.getElementById('doc');
  doc.appendChild(frag);
  document.getElementById('count').textContent = doc.querySelectorAll('*').length.toLocaleString('es-CO');

  const ir = () => {
    const n = Math.min(SECTIONS, Math.max(1, parseInt(document.getElementById('sec').value, 10) || 1));
    document.getElementById('s' + n).scrollIntoView();
  };
  document.getElementById('go').addEventListener('click', ir);
  document.getElementById('sec').addEventListener('keydown', e => { if (e.key === 'Enter') ir(); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NativaX Debug Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
:root {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --panel-2: #fafbfd;
  --text: #1b2130;
  --muted: #6b7385;
  --line: #e2e5ec;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --pass: #15803d;
  --pass-soft: #e8f7ee;
  --fail: #b91c1c;
  --fail-soft: #fdeaea;
  --warn: #b45309;
  --warn-soft: #fdf3e3;
  --unrun: #8b93a7;
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0e1220;
  --panel: #161b2c;
  --panel-2: #121728;
  --text: #e8ebf4;
  --muted: #939cb4;
  --line: #272e46;
  --accent: #8b93ff;
  --accent-soft: #222447;
  --pass: #4ade80;
  --pass-soft: #143024;
  --fail: #f87171;
  --fail-soft: #35191c;
  --warn: #fbbf24;
  --warn-soft: #352a14;
  --unrun: #7c859b;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app {
  display: grid; min-height: 100vh;
  grid-template-columns: 232px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
}

/* ---------- top navbar: execution tabs (no logo) ---------- */
.topbar {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.run-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.run-tab {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 600;
}
.run-tab:hover { border-color: var(--accent); }
.run-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.run-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.run-controls label { display: flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }
.run-controls select, .run-controls input[type="text"] {
  padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-2); font-size: 13px;
}
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 7px 13px; font-size: 13px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--fail); border-color: var(--fail); }
.btn:disabled { opacity: .55; cursor: default; }
.run-state { display: flex; align-items: center; gap: 8px; margin-left: auto; min-width: 220px; }
.run-state .txt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.run-state .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.run-state .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unrun); flex: none; }
.dot.running { background: var(--accent); animation: pulse 1s infinite; }
.dot.pass { background: var(--pass); }
.dot.fail, .dot.error { background: var(--fail); }
.dot.warn, .dot.blocked { background: var(--warn); }
@keyframes pulse { 50% { opacity: .25; } }
.icon-btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 10px; }

/* ---------- left sidebar ---------- */
.sidebar {
  border-right: 1px solid var(--line); background: var(--panel);
  padding: 14px 10px 24px; overflow: auto;
  position: sticky; top: 58px; height: calc(100vh - 58px);
}
.side-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); padding: 6px 10px; margin-top: 8px;
}
.nav { display: grid; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  border: 0; background: transparent; color: var(--text);
  padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13px;
}
.nav button:hover { background: var(--panel-2); }
.nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav .count { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.sec-item b { font-family: var(--mono); font-size: 12px; }
.sec-item small { color: var(--muted); font-size: 11px; margin-left: auto; }
.side-foot { margin: 16px 8px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.5; }

/* ---------- content + right judge ---------- */
.content { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; align-items: start; }
.work { min-width: 0; display: grid; gap: 14px; }
.view { display: none; gap: 14px; }
.view.active { display: grid; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel h2 { margin: 0; font-size: 15px; }
.panel h3 { margin: 16px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.hint { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--mono); }
.empty {
  display: grid; place-items: center; text-align: center; gap: 6px;
  padding: 56px 20px; color: var(--muted);
  border: 1px dashed var(--line); border-radius: var(--radius); background: var(--panel);
}
.empty b { color: var(--text); font-size: 15px; }
.empty .ico { font-size: 28px; opacity: .5; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.kpi .v { font-size: 24px; font-weight: 800; }
.kpi .l { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; }
.kpi.pass .v { color: var(--pass); } .kpi.fail .v, .kpi.error .v { color: var(--fail); }
.kpi.warn .v, .kpi.blocked .v { color: var(--warn); }

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge.pass { background: var(--pass-soft); color: var(--pass); }
.badge.fail, .badge.error { background: var(--fail-soft); color: var(--fail); }
.badge.warn, .badge.blocked { background: var(--warn-soft); color: var(--warn); }
.badge.unrun { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.badge.running { background: var(--accent-soft); color: var(--accent); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
th { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
tbody tr:hover { background: var(--panel-2); }
td.num { text-align: right; font-family: var(--mono); }
.bar-mini { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; display: flex; min-width: 70px; }
.bar-mini i { display: block; height: 100%; }
.i-pass { background: var(--pass); } .i-fail { background: var(--fail); }
.i-blocked, .i-warn { background: var(--warn); } .i-unrun { background: var(--line); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select {
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-2); font-size: 13px;
}
.filters input { min-width: 200px; }

.log {
  margin: 10px 0 0; max-height: 230px; overflow: auto; background: #0b1020;
  color: #d9e2ff; padding: 10px; border-radius: 8px;
  font-family: var(--mono); font-size: 11px; white-space: pre-wrap; line-height: 1.5;
}
.events { margin-top: 10px; max-height: 320px; overflow: auto; display: grid; gap: 4px; }
.event {
  display: flex; gap: 8px; align-items: baseline; padding: 5px 8px;
  border-radius: 6px; background: var(--panel-2); font-size: 12px;
}
.event .id { font-family: var(--mono); }
.event .msg { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event .st { margin-left: auto; }

.pipeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.step {
  border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  background: var(--panel-2); text-align: center; font-size: 12px; font-weight: 700;
  color: var(--muted);
}
.step.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step.done { border-color: var(--pass); color: var(--pass); background: var(--pass-soft); }
.compare { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.compare figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 8px; }
.compare figcaption { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 6px; }
.compare img { width: 100%; display: block; border-radius: 6px; background: #fff; min-height: 90px; }
.compare img[src=""] { visibility: hidden; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; margin: 10px 0; }
.metric { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 8px 10px; }
.metric .v { font-size: 18px; font-weight: 800; }
.metric .l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.artifacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.artifact { border: 1px solid var(--line); border-radius: 8px; padding: 7px; background: var(--panel-2); font-size: 11px; }
.artifact img { width: 100%; height: 100px; object-fit: cover; border-radius: 5px; background: var(--line); }

/* ---------- judge (right) ---------- */
.judge {
  position: sticky; top: 74px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.judge-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.judge-head h2 { margin: 0; font-size: 14px; }
.judge-body { padding: 12px 14px; display: grid; gap: 12px; }
.judge-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
.judge-section { display: grid; gap: 6px; }
.judge-section h3 { margin: 0; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.std {
  display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: baseline;
  padding: 6px 8px; border-radius: 7px; background: var(--panel-2);
  border: 1px solid var(--line); font-size: 12px;
}
.std .mark { font-weight: 800; }
.std.ok { border-color: color-mix(in srgb, var(--pass) 35%, var(--line)); }
.std.ok .mark { color: var(--pass); }
.std.bad { border-color: color-mix(in srgb, var(--fail) 35%, var(--line)); }
.std.bad .mark { color: var(--fail); }
.std.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.std.warn .mark { color: var(--warn); }
.std .val { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.stdbar { display: grid; gap: 4px; padding: 6px 8px; border-radius: 7px;
  background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
.stdbar-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.stdbar-head .val { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.judge-case { display: flex; gap: 8px; align-items: center; padding: 6px 8px;
  border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line);
  font-size: 12px; cursor: pointer; }
.judge-case:hover { border-color: var(--accent); }
.judge-case .id { font-family: var(--mono); }
.judge-case .st { margin-left: auto; }
.verdict { padding: 10px; border-radius: 9px; font-weight: 800; text-align: center; font-size: 13px; }
.verdict.pass { background: var(--pass-soft); color: var(--pass); }
.verdict.fail { background: var(--fail-soft); color: var(--fail); }
.verdict.warn { background: var(--warn-soft); color: var(--warn); }
.verdict.running { background: var(--accent-soft); color: var(--accent); }
.verdict.unrun { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h3 { margin-top: 0; font-family: var(--mono); }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: .3s; pointer-events: none; z-index: 90;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 1180px) { .content { grid-template-columns: minmax(0, 1fr); } .judge { position: static; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .compare, .pipeline { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <nav class="run-tabs" id="run-tabs" aria-label="Runs">
      <button class="run-tab active" data-mode="tests"><i class="fa-solid fa-vial"></i> Run tests</button>
      <button class="run-tab" data-mode="visual"><i class="fa-solid fa-images"></i> Chrome vs NativaX</button>
      <button class="run-tab" data-mode="responsive"><i class="fa-solid fa-arrows-left-right"></i> Responsive</button>
    </nav>

    <div class="run-controls" id="run-controls">
      <label>Scope
        <select id="scope">
          <option value="all">All</option>
          <option value="section">Section</option>
        </select>
      </label>
      <label id="section-wrap">Section
        <select id="section"></select>
      </label>
      <label id="case-wrap" hidden>Case
        <select id="case"></select>
      </label>
      <label id="widths-wrap" hidden>Widths
        <select id="widths">
          <option value="1024">1024 px</option>
          <option value="768,1024">768 · 1024 px</option>
          <option value="320,768,1024">320 · 768 · 1024 px</option>
        </select>
      </label>
      <label id="sweep-wrap" hidden><input type="checkbox" id="sweep"> responsive sweep</label>
      <button class="btn primary" id="btn-run"><i class="fa-solid fa-play"></i> Start</button>
      <button class="btn danger" id="btn-stop" disabled><i class="fa-solid fa-stop"></i> Stop</button>
    </div>

    <div class="run-state">
      <span class="dot" id="run-dot"></span>
      <span class="txt" id="run-text">No run</span>
      <span class="bar"><i id="run-bar"></i></span>
    </div>
    <button class="icon-btn" id="btn-theme" aria-label="Toggle theme">◐</button>
  </header>

  <aside class="sidebar">
    <div class="side-title">Views</div>
    <nav class="nav" id="views">
      <button data-view="resumen" class="active">Summary</button>
      <button data-view="envivo">Live <span class="count" id="cnt-live"></span></button>
      <button data-view="informes">Reports</button>
      <button data-view="visual">Visual</button>
      <button data-view="rendimiento">Performance</button>
      <button data-view="historial">History</button>
      <button data-view="artefactos">Artifacts</button>
    </nav>
    <div class="side-title">Sections</div>
    <nav class="nav" id="sections"></nav>
    <div class="side-foot" id="side-foot">No runs yet.</div>
  </aside>

  <main class="content">
    <div class="work">
      <section class="view active" id="view-resumen"></section>
      <section class="view" id="view-envivo"></section>
      <section class="view" id="view-informes"></section>
      <section class="view" id="view-visual"></section>
      <section class="view" id="view-rendimiento"></section>
      <section class="view" id="view-historial"></section>
      <section class="view" id="view-artefactos"></section>
    </div>

    <aside class="judge" aria-label="Execution judge">
      <div class="judge-head">
        <h2>Judge</h2>
        <span class="badge unrun" id="judge-badge">no run</span>
      </div>
      <div class="judge-body" id="judge-body"></div>
    </aside>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlg-title"></h3>
    <div id="dlg-body" class="hint"></div>
    <p><button class="btn primary">Cerrar</button></p>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="dashboard_data.js"></script>
<script src="dashboard.js"></script>
</body>
</html>

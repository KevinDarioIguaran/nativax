name: nativa_debug_harness
description: Offscreen NativaX harnesses used by the debug suite engines (visual comparison, performance probe, JSON audit batches). Not an app and not a runtime dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  nativax: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

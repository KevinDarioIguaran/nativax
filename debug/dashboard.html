<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debug Lab · Dashboard</title>
  <style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1c2230;
  --muted: #6b7385;
  --line: #e3e6ec;
  --accent: #4f46e5;
  --pass: #16a34a;
  --fail: #dc2626;
  --skip: #d97706;
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1320;
  --panel: #171c2e;
  --text: #e7eaf3;
  --muted: #8d96ad;
  --line: #262d45;
  --accent: #818cf8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; gap: 12px; align-items: center; }
.logo {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--accent); color: #fff; border-radius: 10px; font-size: 22px;
}
.brand h1 { margin: 0; font-size: 18px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.actions { display: flex; gap: 8px; }

.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px;
}
.kpi .v { font-size: 28px; font-weight: 700; }
.kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi.pass .v { color: var(--pass); }
.kpi.fail .v { color: var(--fail); }
.kpi.skip .v { color: var(--skip); }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.panel h2 { margin: 0; font-size: 16px; }
.panel h3 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
.hint { font-size: 12px; color: var(--muted); }

.sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.sec {
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  cursor: pointer; transition: transform .15s, border-color .15s; background: var(--bg);
}
.sec:hover { transform: translateY(-2px); border-color: var(--accent); }
.sec.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.sec .row { display: flex; justify-content: space-between; align-items: baseline; }
.sec b { font-family: var(--mono); font-size: 13px; }
.sec small { color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; margin-top: 10px; }
.bar i { display: block; height: 100%; transition: width .4s; }
.bar .p { background: var(--pass); }
.bar .f { background: var(--fail); }
.bar .s { background: var(--skip); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 14px;
}
.filters input { min-width: 220px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg); }
td.mono { font-family: var(--mono); font-size: 13px; }
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.badge.pass { background: color-mix(in srgb, var(--pass) 15%, transparent); color: var(--pass); }
.badge.fail { background: color-mix(in srgb, var(--fail) 15%, transparent); color: var(--fail); }
.badge.blocked { background: color-mix(in srgb, var(--skip) 15%, transparent); color: var(--skip); }
.badge.skip { background: color-mix(in srgb, var(--skip) 15%, transparent); color: var(--skip); }
.badge.error { background: color-mix(in srgb, var(--fail) 15%, transparent); color: var(--fail); }
.badge.unrun { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--muted); }

.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pager .btn { padding: 4px 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

.gaps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 420px; overflow: auto; }
.gaps li {
  display: flex; gap: 10px; align-items: center; padding: 8px 10px;
  border: 1px dashed var(--line); border-radius: 8px; font-size: 13px;
}
.gaps li span.n { font-family: var(--mono); color: var(--muted); width: 28px; }
.gaps li em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--skip); }

.tree, .cli {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6;
  overflow: auto; margin: 0;
}
.cli code { display: block; cursor: pointer; }
.cli code:hover { color: var(--accent); }

dialog {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); color: var(--text); max-width: 520px; width: calc(100% - 32px);
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h3 { margin-top: 0; font-family: var(--mono); }
dialog dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
dialog dt { color: var(--muted); }
dialog dd { margin: 0; word-break: break-word; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: .3s; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⌁</span>
      <div>
        <h1>Debug Lab</h1>
        <p>nativax-debug · nativax-runtime</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-theme" class="btn" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis" aria-label="Resumen"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Secciones</h2>
        <span class="hint">Cada sección registra 15 casos reales (s01–s16)</span>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Casos</h2>
        <div class="filters">
          <input id="q" type="search" placeholder="Buscar caso, repo o fact…">
          <select id="f-section"></select>
          <select id="f-status">
            <option value="">Todos los estados</option>
            <option value="pass">Pass</option>
            <option value="fail">Fail</option>
            <option value="blocked">Blocked</option>
            <option value="skip">Skip</option>
            <option value="error">Error</option>
            <option value="unrun">Unrun</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="cases">
          <thead>
            <tr><th>ID</th><th>Sección</th><th>Procedencia</th><th>Facts</th><th>ms</th><th>Estado</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="count"></span>
        <div>
          <button class="btn" id="prev">←</button>
          <button class="btn" id="next">→</button>
        </div>
      </div>
    </section>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>s17 · Capacidades bloqueadas</h2>
          <span class="hint" id="gaps-count"></span>
        </div>
        <ul class="gaps" id="gaps"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Estructura</h2></div>
        <pre class="tree" id="tree"></pre>
        <h3>CLI</h3>
        <div class="cli" id="cli"></div>
      </section>
    </div>
  </main>

  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <dl id="dlg-body"></dl>
      <button class="btn primary">Cerrar</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script src="dashboard_data.js"></script>
  <script src="dashboard.js"></script>

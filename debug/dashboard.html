<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debug Lab · Dashboard</title>
  <style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1c2230;
  --muted: #6b7385;
  --line: #e3e6ec;
  --accent: #4f46e5;
  --pass: #16a34a;
  --fail: #dc2626;
  --skip: #d97706;
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1320;
  --panel: #171c2e;
  --text: #e7eaf3;
  --muted: #8d96ad;
  --line: #262d45;
  --accent: #818cf8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; gap: 12px; align-items: center; }
.logo {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--accent); color: #fff; border-radius: 10px; font-size: 22px;
}
.brand h1 { margin: 0; font-size: 18px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.actions { display: flex; gap: 8px; }

.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px;
}
.kpi .v { font-size: 28px; font-weight: 700; }
.kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi.pass .v { color: var(--pass); }
.kpi.fail .v { color: var(--fail); }
.kpi.skip .v { color: var(--skip); }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}
.panel h2 { margin: 0; font-size: 16px; }
.panel h3 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; }
.hint { font-size: 12px; color: var(--muted); }

.sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.sec {
  border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  cursor: pointer; transition: transform .15s, border-color .15s; background: var(--bg);
}
.sec:hover { transform: translateY(-2px); border-color: var(--accent); }
.sec.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.sec .row { display: flex; justify-content: space-between; align-items: baseline; }
.sec b { font-family: var(--mono); font-size: 13px; }
.sec small { color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; margin-top: 10px; }
.bar i { display: block; height: 100%; transition: width .4s; }
.bar .p { background: var(--pass); }
.bar .f { background: var(--fail); }
.bar .s { background: var(--skip); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters input, .filters select {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit; font-size: 14px;
}
.filters input { min-width: 220px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--bg); }
td.mono { font-family: var(--mono); font-size: 13px; }
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.badge.pass { background: color-mix(in srgb, var(--pass) 15%, transparent); color: var(--pass); }
.badge.fail { background: color-mix(in srgb, var(--fail) 15%, transparent); color: var(--fail); }
.badge.skip { background: color-mix(in srgb, var(--skip) 15%, transparent); color: var(--skip); }
.badge.run { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
.pager .btn { padding: 4px 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

.gaps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 420px; overflow: auto; }
.gaps li {
  display: flex; gap: 10px; align-items: center; padding: 8px 10px;
  border: 1px dashed var(--line); border-radius: 8px; font-size: 13px;
}
.gaps li span.n { font-family: var(--mono); color: var(--muted); width: 28px; }
.gaps li em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--skip); }

.tree, .cli {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6;
  overflow: auto; margin: 0;
}
.cli code { display: block; cursor: pointer; }
.cli code:hover { color: var(--accent); }

dialog {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); color: var(--text); max-width: 520px; width: calc(100% - 32px);
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h3 { margin-top: 0; font-family: var(--mono); }
dialog dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; }
dialog dt { color: var(--muted); }
dialog dd { margin: 0; word-break: break-word; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
  font-size: 14px; opacity: 0; transition: .3s; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⌁</span>
      <div>
        <h1>Debug Lab</h1>
        <p>nativax-debug · nativax-runtime</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-run-all" class="btn primary">▶ Ejecutar todo (--all)</button>
      <button id="btn-theme" class="btn" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis" aria-label="Resumen"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Secciones</h2>
        <span class="hint">Cada sección registra 15 casos reales (s01–s16)</span>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Casos</h2>
        <div class="filters">
          <input id="q" type="search" placeholder="Buscar caso, repo o fact…">
          <select id="f-section"></select>
          <select id="f-status">
            <option value="">Todos los estados</option>
            <option value="pass">Pass</option>
            <option value="fail">Fail</option>
            <option value="skip">Skip</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table id="cases">
          <thead>
            <tr><th>ID</th><th>Sección</th><th>Procedencia</th><th>Facts</th><th>ms</th><th>Estado</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="count"></span>
        <div>
          <button class="btn" id="prev">←</button>
          <button class="btn" id="next">→</button>
        </div>
      </div>
    </section>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>s17 · Capacidades bloqueadas</h2>
          <span class="hint" id="gaps-count"></span>
        </div>
        <ul class="gaps" id="gaps"></ul>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Estructura</h2></div>
        <pre class="tree" id="tree"></pre>
        <h3>CLI</h3>
        <div class="cli" id="cli"></div>
      </section>
    </div>
  </main>

  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlg-title"></h3>
      <dl id="dlg-body"></dl>
      <button class="btn primary">Cerrar</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
/* Debug Lab dashboard — datos de ejemplo generados localmente */
(() => {
  const SECTIONS = [
    ['s01', 'html'], ['s02', 'css'], ['s03', 'box'], ['s04', 'typo'],
    ['s05', 'color'], ['s06', 'anim'], ['s07', 'resp'], ['s08', 'flex'],
    ['s09', 'pos'], ['s10', 'jsdom'], ['s11', 'events'], ['s12', 'forms'],
    ['s13', 'a11y'], ['s14', 'media'], ['s15', 'perf'], ['s16', 'integ'],
  ];
  const REPOS = [
    'mdn/css-examples', 'web-platform-tests/wpt', 'jsdom/jsdom',
    'w3c/csswg-drafts', 'h5bp/html5-boilerplate', 'twbs/bootstrap',
    'nicolo-ribaudo/tc39-proposal-examples', 'GoogleChrome/web-vitals',
  ];
  const GAPS = [
    'CSS Houdini Paint API', 'Container queries', 'View Transitions', 'Subgrid',
    ':has() selector', 'Scroll-driven animations', 'Anchor positioning', 'CSS nesting',
    '@layer cascade', 'Web Animations API (completo)', 'IntersectionObserver real',
    'ResizeObserver real', 'MutationObserver (avanzado)', 'Custom Elements', 'Shadow DOM',
    'Canvas 2D', 'SVG filters', 'Web Fonts loading', 'Media queries de color-gamut',
    'Pointer Events multitouch', 'Drag & Drop nativo', 'contenteditable',
    'Form validation API (completa)', 'ARIA live regions', 'Print stylesheets', 'Service Workers',
  ];
  const TREE = `debug/
├─ bootstrap.py
├─ README.md
├─ progress/
├─ tools/
│  └─ import_real_examples.py
└─ lab/
   ├─ harness.py
   ├─ run_lab.py
   ├─ corpus.py
   ├─ corpus.json
   ├─ ATTRIBUTION.md
   ├─ sections/
   │  ├─ s01.py … s16.py
   │  └─ s17_gaps.py
   └─ cases/
      └─ s01/001 … s16/015  (240 ejemplos)`;
  const CLI = [
    'python debug/bootstrap.py',
    'python debug/lab/run_lab.py --all',
    'python debug/lab/run_lab.py s07',
    'python debug/lab/run_lab.py --list',
    'python debug/tools/import_real_examples.py --check',
  ];

  let seed = 42;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);

  const cases = [];
  SECTIONS.forEach(([sid, name]) => {
    for (let i = 1; i <= 15; i++) {
      const r = rnd();
      const repo = REPOS[Math.floor(rnd() * REPOS.length)];
      cases.push({
        id: `${sid}/${String(i).padStart(3, '0')}`,
        sid, name,
        repo,
        commit: Math.floor(rnd() * 0xfffffff).toString(16).padStart(7, '0'),
        path: `${name}/example-${i}/index.html`,
        facts: 2 + Math.floor(rnd() * 5),
        ms: Math.round(20 + rnd() * 380),
        status: r < 0.88 ? 'pass' : r < 0.95 ? 'fail' : 'skip',
      });
    }
  });

  const $ = (s) => document.querySelector(s);
  const state = { q: '', section: '', status: '', page: 0, size: 12 };

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function counts(list) {
    return list.reduce((a, c) => ((a[c.status] = (a[c.status] || 0) + 1), a), {});
  }

  function renderKpis() {
    const c = counts(cases);
    const total = cases.length;
    const avg = Math.round(cases.reduce((s, x) => s + x.ms, 0) / total);
    const items = [
      ['Casos reales', total, ''],
      ['Secciones', SECTIONS.length, ''],
      ['Pass', c.pass || 0, 'pass'],
      ['Fail', c.fail || 0, 'fail'],
      ['Skip', c.skip || 0, 'skip'],
      ['Gaps documentados', GAPS.length, ''],
      ['Tiempo medio', avg + ' ms', ''],
    ];
    $('#kpis').innerHTML = items
      .map(([l, v, k]) => `<div class="kpi ${k}"><div class="v">${v}</div><div class="l">${l}</div></div>`)
      .join('');
  }

  function renderSections() {
    $('#sections').innerHTML = SECTIONS.map(([sid, name]) => {
      const list = cases.filter((c) => c.sid === sid);
      const c = counts(list);
      const pct = (n) => ((n || 0) / list.length) * 100;
      return `<div class="sec ${state.section === sid ? 'active' : ''}" data-sid="${sid}">
        <div class="row"><b>${sid} · ${name}</b><small>${c.pass || 0}/${list.length}</small></div>
        <div class="bar">
          <i class="p" style="width:${pct(c.pass)}%"></i>
          <i class="f" style="width:${pct(c.fail)}%"></i>
          <i class="s" style="width:${pct(c.skip)}%"></i>
        </div></div>`;
    }).join('');
  }

  function filtered() {
    const q = state.q.toLowerCase();
    return cases.filter((c) =>
      (!state.section || c.sid === state.section) &&
      (!state.status || c.status === state.status) &&
      (!q || `${c.id} ${c.name} ${c.repo} ${c.path}`.toLowerCase().includes(q)));
  }

  function renderTable() {
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / state.size));
    state.page = Math.min(state.page, pages - 1);
    const slice = list.slice(state.page * state.size, (state.page + 1) * state.size);
    $('#cases tbody').innerHTML = slice.map((c) => `
      <tr data-id="${c.id}">
        <td class="mono">${c.id}</td>
        <td>${c.name}</td>
        <td class="mono">${c.repo}@${c.commit}</td>
        <td>${c.facts}</td>
        <td>${c.ms}</td>
        <td><span class="badge ${c.status}">${c.status}</span></td>
      </tr>`).join('') || '<tr><td colspan="6">Sin resultados</td></tr>';
    $('#count').textContent = `${list.length} casos · página ${state.page + 1}/${pages}`;
    $('#prev').disabled = state.page === 0;
    $('#next').disabled = state.page >= pages - 1;
  }

  function renderStatic() {
    $('#gaps').innerHTML = GAPS.map((g, i) =>
      `<li><span class="n">${String(i + 1).padStart(2, '0')}</span>${g}<em>bloqueada</em></li>`).join('');
    $('#gaps-count').textContent = `${GAPS.length} capacidades`;
    $('#tree').textContent = TREE;
    $('#cli').innerHTML = CLI.map((c) => `<code>$ ${c}</code>`).join('');
    $('#f-section').innerHTML = '<option value="">Todas las secciones</option>' +
      SECTIONS.map(([s, n]) => `<option value="${s}">${s} · ${n}</option>`).join('');
  }

  function openCase(id) {
    const c = cases.find((x) => x.id === id);
    $('#dlg-title').textContent = `case ${c.id}`;
    $('#dlg-body').innerHTML = `
      <dt>Sección</dt><dd>${c.name}</dd>
      <dt>Repo</dt><dd>${c.repo}</dd>
      <dt>Commit</dt><dd>${c.commit}</dd>
      <dt>Ruta original</dt><dd>${c.path}</dd>
      <dt>Facts</dt><dd>${c.facts} verificaciones independientes</dd>
      <dt>Duración</dt><dd>${c.ms} ms</dd>
      <dt>Estado</dt><dd><span class="badge ${c.status}">${c.status}</span></dd>`;
    $('#dlg').showModal();
  }

  function refresh() { renderKpis(); renderSections(); renderTable(); }

  async function runAll() {
    const btn = $('#btn-run-all');
    btn.disabled = true;
    const rows = [...document.querySelectorAll('#cases tbody .badge')];
    rows.forEach((b) => { b.className = 'badge run'; b.textContent = 'running'; });
    for (let i = 0; i < SECTIONS.length; i++) {
      btn.textContent = `Ejecutando ${SECTIONS[i][0]}… ${i + 1}/${SECTIONS.length}`;
      await new Promise((r) => setTimeout(r, 180));
    }
    btn.textContent = '▶ Ejecutar todo (--all)';
    btn.disabled = false;
    refresh();
    toast('Simulación completada (datos de ejemplo)');
  }

  $('#sections').addEventListener('click', (e) => {
    const el = e.target.closest('.sec');
    if (!el) return;
    state.section = state.section === el.dataset.sid ? '' : el.dataset.sid;
    $('#f-section').value = state.section;
    state.page = 0;
    renderSections(); renderTable();
  });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; state.page = 0; renderTable(); });
  $('#f-section').addEventListener('change', (e) => { state.section = e.target.value; state.page = 0; renderSections(); renderTable(); });
  $('#f-status').addEventListener('change', (e) => { state.status = e.target.value; state.page = 0; renderTable(); });
  $('#prev').addEventListener('click', () => { state.page--; renderTable(); });
  $('#next').addEventListener('click', () => { state.page++; renderTable(); });
  $('#cases tbody').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openCase(tr.dataset.id);
  });
  $('#btn-run-all').addEventListener('click', runAll);
  $('#btn-theme').addEventListener('click', () => {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });
  $('#cli').addEventListener('click', (e) => {
    if (e.target.tagName === 'CODE') {
      navigator.clipboard?.writeText(e.target.textContent.replace(/^\$ /, ''));
      toast('Comando copiado');
    }
  });

  renderStatic();
  refresh();
})();
  </script>
</body>
</html>

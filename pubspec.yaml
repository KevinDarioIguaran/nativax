name: nativa_workspace
description: Monorepo root for the Nativa family (NativaX, NativaJS, NativaWeb, NativaRender, NativaFlow, NativaForge, NativaShield and NativaBench).
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/nativa_css
  - packages/nativa_dom
  - packages/nativa_dom_bindings
  - packages/nativa_html
  - packages/nativa_js
  - packages/nativa_render
  - packages/nativax
  - examples/web-challenge
  - examples/game-player
  - examples/render-benchmark
  - tools/conformance
  - tools/benchmark
  - tools/leaks
  - tools/security

dev_dependencies:
  lints: ^6.0.0

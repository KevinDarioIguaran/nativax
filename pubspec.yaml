name: nativa_workspace
description: Monorepo root for the Nativa family (NativaX, NativaJS, NativaWeb, NativaRender, NativaFlow, NativaForge, NativaShield and NativaBench).
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/nativa_css
  - packages/nativa_dom
  - packages/nativa_dom_bindings
  - packages/nativa_html
  - packages/nativa_js
  - packages/nativa_render
  - packages/nativax
  - examples/web-challenge
  - examples/game-player
  - examples/render-benchmark
  - debug/engines/compatibility
  - debug/engines/microbenchmarks
  - debug/engines/memory
  - debug/engines/security
  - debug/engines/visual_comparison
  - debug/engines/performance
  - debug/harness

dev_dependencies:
  lints: ^6.0.0

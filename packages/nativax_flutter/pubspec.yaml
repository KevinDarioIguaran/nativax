name: nativax_flutter
description: Flutter renderer for NativaX documents (CSS boxes, block flow, flexbox).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  nativax_css: ^0.1.0
  nativax_dom: ^0.1.0
  nativax_js: ^0.1.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  nativax_dom_bindings: ^0.1.0
  nativax_html: ^0.1.0
  lints: ^6.0.0
